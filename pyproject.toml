[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
customer-support-agent = "customer_support_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
